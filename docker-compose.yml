# Elasticsearch requires vm.max_map_count=262144 on the host; Compose cannot set this host kernel value.
services:
  postgres:
    image: postgres:16
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?INGEST_DB_PASSWORD must be set}
      PROCESSOR_DB_PASSWORD: ${PROCESSOR_DB_PASSWORD:?PROCESSOR_DB_PASSWORD must be set}
      INSIGHTS_DB_PASSWORD: ${INSIGHTS_DB_PASSWORD:?INSIGHTS_DB_PASSWORD must be set}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks: [tokenburn]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnamilegacy/kafka:3.9
    mem_limit: 1.5g
    environment:
      KAFKA_CFG_NODE_ID: ${KAFKA_NODE_ID:?KAFKA_NODE_ID must be set}
      KAFKA_CFG_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:?KAFKA_PROCESS_ROLES must be set}
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:?KAFKA_CONTROLLER_QUORUM_VOTERS must be set}
      KAFKA_CFG_LISTENERS: ${KAFKA_LISTENERS:?KAFKA_LISTENERS must be set}
      KAFKA_CFG_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:?KAFKA_ADVERTISED_LISTENERS must be set}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:?KAFKA_LISTENER_SECURITY_PROTOCOL_MAP must be set}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:?KAFKA_CONTROLLER_LISTENER_NAMES must be set}
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:?KAFKA_INTER_BROKER_LISTENER_NAME must be set}
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:?KAFKA_AUTO_CREATE_TOPICS_ENABLE must be set}
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:?KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR must be set}
      ALLOW_PLAINTEXT_LISTENER: ${KAFKA_ALLOW_PLAINTEXT_LISTENER:?KAFKA_ALLOW_PLAINTEXT_LISTENER must be set}
    networks: [tokenburn]
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    mem_limit: 1.5g
    environment:
      discovery.type: ${ELASTIC_DISCOVERY_TYPE:?ELASTIC_DISCOVERY_TYPE must be set}
      xpack.security.enabled: ${ELASTIC_SECURITY_ENABLED:?ELASTIC_SECURITY_ENABLED must be set}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:?ES_JAVA_OPTS must be set}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [tokenburn]
    expose: ["9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    mem_limit: 1g
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    networks: [tokenburn]
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ./backend
      dockerfile: src/api.TokenBurn.Identity/Dockerfile
    mem_limit: 512m
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:?ASPNETCORE_URLS must be set}
      ConnectionStrings__Identity: ${IDENTITY_CONNECTION_STRING:?IDENTITY_CONNECTION_STRING must be set}
      Jwt__Authority: ${JWT_AUTHORITY_URL:?JWT_AUTHORITY_URL must be set}
      Identity__CollectorClientSecret: ${IDENTITY__COLLECTORCLIENTSECRET:?IDENTITY__COLLECTORCLIENTSECRET must be set}
      Identity__SelfTelemetryClientSecret: ${IDENTITY__SELFTELEMETRYCLIENTSECRET:-}
      Identity__DevUser__Username: ${IDENTITY__DEVUSER__USERNAME:?IDENTITY__DEVUSER__USERNAME must be set}
      Identity__DevUser__Password: ${IDENTITY__DEVUSER__PASSWORD:?IDENTITY__DEVUSER__PASSWORD must be set}
    networks: [tokenburn]
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest:
    build:
      context: ./backend
      dockerfile: src/api.TokenBurn.Ingest/Dockerfile
    mem_limit: 512m
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:?ASPNETCORE_URLS must be set}
      ConnectionStrings__Ingest: ${INGEST_CONNECTION_STRING:?INGEST_CONNECTION_STRING must be set}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set}
      Jwt__Authority: ${JWT_AUTHORITY_URL:?JWT_AUTHORITY_URL must be set}
      Jwt__MetadataAddress: ${JWT_METADATA_ADDRESS:?JWT_METADATA_ADDRESS must be set}
      Ingest__RateLimit__TokenLimit: 10000
      Ingest__RateLimit__TokensPerPeriod: 10000
    networks: [tokenburn]
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  insights:
    build:
      context: ./backend
      dockerfile: src/api.TokenBurn.Insights/Dockerfile
    mem_limit: 512m
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:?ASPNETCORE_URLS must be set}
      ConnectionStrings__Insights: ${INSIGHTS_CONNECTION_STRING:?INSIGHTS_CONNECTION_STRING must be set}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set}
      Insights__RateLimit__TokenLimit: 10000
      Insights__RateLimit__TokensPerPeriod: 10000
      Elasticsearch__Uri: ${ELASTICSEARCH_URI:?ELASTICSEARCH_URI must be set}
      Elasticsearch__Username: ${ELASTICSEARCH_USERNAME:?ELASTICSEARCH_USERNAME must be set}
      Elasticsearch__Password: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
      Embeddings__Uri: ${EMBEDDINGS_URI:-}
      Ask__Provider: ${ASK_PROVIDER:-fake}
      Ask__DeepSeekApiKey: ${ASK_DEEPSEEK_API_KEY:-}
      Ask__DeepSeekEndpoint: ${ASK_DEEPSEEK_ENDPOINT:-}
      Jwt__Authority: ${JWT_AUTHORITY_URL:?JWT_AUTHORITY_URL must be set}
      Jwt__MetadataAddress: ${JWT_METADATA_ADDRESS:?JWT_METADATA_ADDRESS must be set}
    networks: [tokenburn]
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      identity: {condition: service_healthy}
      kafka: {condition: service_healthy}
      processor: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  processor:
    build:
      context: ./backend
      dockerfile: src/TokenBurn.Processor/Dockerfile
    mem_limit: 1g
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Processor: ${PROCESSOR_CONNECTION_STRING:?PROCESSOR_CONNECTION_STRING must be set}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set}
      Elasticsearch__Uri: ${ELASTICSEARCH_URI:?ELASTICSEARCH_URI must be set}
      Elasticsearch__Username: ${ELASTICSEARCH_USERNAME:?ELASTICSEARCH_USERNAME must be set}
      Elasticsearch__Password: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
      Embeddings__Uri: ${EMBEDDINGS_URI:?EMBEDDINGS_URI must be set}
      Jwt__Authority: ${JWT_AUTHORITY_URL:?JWT_AUTHORITY_URL must be set}
      Jwt__MetadataAddress: ${JWT_METADATA_ADDRESS:?JWT_METADATA_ADDRESS must be set}
      Processor__Replay__Enabled: ${PROCESSOR_REPLAY_ENABLED:-false}
      Processor__Embeddings__Enabled: ${PROCESSOR_EMBEDDINGS_ENABLED:-false}
      Processor__Aggregate__Enabled: ${PROCESSOR_AGGREGATE_ENABLED:-false}
      Processor__Aggregate__MinSize: ${PROCESSOR_AGGREGATE_MIN_SIZE:-5}
      Documents__ChunkMaxTokens: ${DOCUMENTS_CHUNK_MAX_TOKENS:-512}
      Documents__TokenCharsPerToken: ${DOCUMENTS_TOKEN_CHARS_PER_TOKEN:-4}
      Documents__MaxFileBytes: ${DOCUMENTS_MAX_FILE_BYTES:-5000000}
      Documents__EmbeddingBatchSize: ${DOCUMENTS_EMBEDDING_BATCH_SIZE:-64}
      SelfTelemetry__Enabled: ${SELF_TELEMETRY_ENABLED:-false}
      SelfTelemetry__IntervalMinutes: ${SELF_TELEMETRY_INTERVAL_MINUTES:-60}
      SelfTelemetry__IdentityUrl: http://identity:8080
      SelfTelemetry__IngestUrl: http://ingest:8080
      SelfTelemetry__ClientId: tokenburn-self
      SelfTelemetry__ClientSecret: ${IDENTITY__SELFTELEMETRYCLIENTSECRET:-}
    volumes:
      - ${CLAUDE_TRANSCRIPTS_DIR:?CLAUDE_TRANSCRIPTS_DIR must be set}:/data/transcripts:ro
      - ${DOCUMENTS_DIR:?DOCUMENTS_DIR must be set}:/data/documents:ro
    networks: [tokenburn]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      embeddings: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    mem_limit: 512m
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
      PORT: ${WEB_PORT:?WEB_PORT must be set}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL must be set}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://insights:8080}
    networks: [tokenburn]
    expose: ["3000"]
    depends_on:
      insights: {condition: service_healthy}
      identity: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 128m
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks: [tokenburn]
    depends_on:
      web: {condition: service_healthy}
      insights: {condition: service_healthy}
      ingest: {condition: service_healthy}
      identity: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  elasticsearch-data:

networks:
  tokenburn:
    name: tokenburn
