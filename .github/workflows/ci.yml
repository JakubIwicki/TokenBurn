# TokenBurn CI
name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/TokenBurn.slnx
      - run: dotnet build backend/TokenBurn.slnx --no-restore
      - run: dotnet test backend/TokenBurn.slnx --no-build
      # Pinned delegate-ledger fixture: the derivation script mirrors the adapter's
      # test-handle filter and key collapse; the expected count is pinned at 1148.
      - run: test "$(python3 backend/tests/TokenBurn.Processor.Tests/fixtures/derive-expected-count.py backend/tests/TokenBurn.Processor.Tests/fixtures/delegate-ledger.jsonl)" = "1148"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore desktop/TokenBurn.Desktop.slnx
      - run: dotnet build desktop/TokenBurn.Desktop.slnx --no-restore
      - run: dotnet test desktop/tests/TokenBurn.Desktop.Tests/TokenBurn.Desktop.Tests.csproj --no-build
