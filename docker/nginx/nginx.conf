events {}

http {
  upstream web_upstream { server web:3000; }
  upstream insights_upstream { server insights:8080; }
  upstream ingest_upstream { server ingest:8080; }
  upstream identity_upstream { server identity:8080; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 80;
    server_name localhost;
    return 301 https://localhost$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/certs/tls.pem;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    return 444;
  }

  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/tls.pem;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /.well-known/ { proxy_pass http://identity_upstream; }
    location /connect/ { proxy_pass http://identity_upstream; }
    location /api/ { proxy_pass http://insights_upstream; }
    location /v1/ { proxy_pass http://ingest_upstream; }
    location / { proxy_pass http://web_upstream; }
  }
}
